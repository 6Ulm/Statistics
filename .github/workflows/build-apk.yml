# Dựng APK trên máy chủ GitHub — không cần Android Studio, không cần máy ảo.
#
# Chạy tay: tab Actions → "Dựng APK" → Run workflow → chọn nhánh → Run.
# Xong thì tải ở mục Artifacts của lần chạy ấy (tệp .zip chứa APK).
#
# Bản DEBUG ký bằng khoá debug tự sinh của Gradle: cài thẳng lên máy được,
# không lên được CH Play. Đổi sang assembleRelease thì phải có khoá ký riêng.
name: Dựng APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # KHÔNG dùng android-actions/setup-android: nó gọi `sdkmanager tools`, mà
      # gói "tools" đã bị Google gỡ khỏi kho từ lâu — lần chạy đầu tiên chết ở
      # đúng chỗ này sau 20 giây ("Failed to find package 'tools'").
      # Máy chủ ubuntu-latest vốn đã có sẵn Android SDK; chỉ cần nhận điều khoản
      # rồi lấy đúng hai gói dự án cần.
      - name: Chuẩn bị Android SDK
        run: |
          set -eu
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "dùng $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Nhớ kho Gradle giữa các lần chạy
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Gradle tự sinh ~/.android/debug.keystore nếu chưa có — mà máy chủ thì
      # sạch trơn mỗi lần chạy, nên MỖI lần dựng ra một khoá KHÁC. Hai APK khác
      # chữ ký thì Android không cho cài đè: người dùng phải gỡ bản cũ đi mới
      # cài được bản mới. Nhớ lại khoá ấy giữa các lần chạy để bản sau cài đè
      # được lên bản trước. Đây là khoá debug, ai cũng biết mật khẩu
      # ("android") — không phải khoá phát hành, không có gì để giữ kín.
      - name: Nhớ khoá debug để còn cài đè được
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Dựng bản debug
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Đặt tên APK theo phiên bản
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/BaTuKyMon-${GITHUB_SHA::7}-debug.apk"
          ls -la out

      - name: Nộp APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaTuKyMon-debug-apk
          path: android/out/*.apk
          if-no-files-found: error
          retention-days: 30
