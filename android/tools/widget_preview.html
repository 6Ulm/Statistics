<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Xem trước widget Lịch</title><style>
body{margin:0;background:#79889a;font:14px/1.4 system-ui,sans-serif;padding:16px;
     display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
figure{margin:0}
figcaption{color:#fff;font:600 12px system-ui,sans-serif;padding-bottom:5px}
.widget{border-radius:16px;overflow:hidden;background:#FDECEF;
        box-shadow:0 3px 10px rgba(0,0,0,.28)}
.whead{height:32px;display:flex;align-items:center;background:#D32F2F;color:#fff}
.wnav{width:42px;text-align:center;font-size:19px;line-height:1}
.wtitle{flex:1;text-align:center;font:700 12px system-ui,sans-serif;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas{display:block}
</style></head><body>
<script type="module">
/* ════════════════════════════════════════════════════════════════════
   Bản mô phỏng CalendarWidgetProvider.kt để xem widget mà không cần build.

   Canvas của trình duyệt và Canvas của Android dùng cùng một mô hình vẽ
   (drawText / fillRect / textAlign / textSize) nên hình ra rất sát widget
   thật. Thanh tiêu đề ở đây là HTML vì trong widget nó cũng là View thật
   (widget_calendar.xml), không nằm trong bitmap.

   Dữ liệu âm lịch và tiết khí đọc thẳng từ chính hai tệp assets mà widget
   dùng — sai lệch giữa bản xem trước và widget thật là không thể xảy ra.
   ════════════════════════════════════════════════════════════════════ */

const CAN = ['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'];
const CHI = ['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
const TIET_KHI = ['Đông Chí','Tiểu Hàn','Đại Hàn','Lập Xuân','Vũ Thủy','Kinh Trập',
    'Xuân Phân','Thanh Minh','Cốc Vũ','Lập Hạ','Tiểu Mãn','Mang Chủng','Hạ Chí',
    'Tiểu Thử','Đại Thử','Lập Thu','Xử Thử','Bạch Lộ','Thu Phân','Hàn Lộ',
    'Sương Giáng','Lập Đông','Tiểu Tuyết','Đại Tuyết'];

function jdn(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function civilOf(j){const a=j+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),
  d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153);
  return [100*b+d-4800+Math.floor(m/10), m+3-12*Math.floor(m/10), e-Math.floor((153*m+2)/5)+1];}

/* ── Đọc đúng hai bảng mà LunarTable.kt đọc ── */
const base = new URL('assets/', location.href);
const [lunTxt, jqTxt] = await Promise.all([
    fetch(new URL('lunar_months.txt', base)).then(r => r.text()),
    fetch(new URL('jieqi.txt', base)).then(r => r.text()),
]);
const lunLines = lunTxt.trim().split('\n');
const GZ_EPOCH = parseInt(lunLines[0], 10);
const MONTHS = lunLines.slice(1).map(l => l.split(' ').map(Number));   // [jdn, năm, tháng, nhuận]
const JQ = jqTxt.trim().split('\n').map(l => l.split(' ').map(Number)); // [jdn, phút, chỉ số tên]

function ganzhi(j){const i=((j-GZ_EPOCH)%60+60)%60;return [CAN[i%10],CHI[i%12]];}
/** Tra tháng âm chứa ngày j — tìm nhị phân, y như LunarTable.lunarOf. */
function lunarOf(j){
    let lo=0, hi=MONTHS.length-1, at=-1;
    while(lo<=hi){const mid=(lo+hi)>>1; if(MONTHS[mid][0]<=j){at=mid;lo=mid+1;} else hi=mid-1;}
    if(at<0) return null;
    return {day: j-MONTHS[at][0]+1, month: MONTHS[at][2], leap: MONTHS[at][3]===1};
}
function jieQiOfMonth(y,m){
    const from=jdn(y,m,1), to=jdn(m===12?y+1:y, m===12?1:m+1, 1);
    return JQ.filter(r => r[0]>=from && r[0]<to)
             .map(r => ({name: TIET_KHI[r[2]], jdn: r[0], minutes: r[1]}));
}

/* ── drawBody() của CalendarWidgetProvider.kt ── */
function drawBody(canvas, wDp, hDp, density, year, month, todayJdn) {
    const w = Math.round(wDp*density), h = Math.round(hDp*density);
    canvas.width=w; canvas.height=h;
    canvas.style.width=wDp+'px'; canvas.style.height=hDp+'px';
    const c = canvas.getContext('2d');
    const dp = v => v*density;

    const first=new Date(year,month-1,1);
    const lead=(first.getDay()+6)%7;
    const daysInMonth=new Date(year,month,0).getDate();
    const weeks=Math.max(1,Math.ceil((lead+daysInMonth)/7));

    const jieQi=jieQiOfMonth(year,month);
    const jqRowH = jieQi.length
        ? Math.max(dp(9), Math.min(dp(15), (h*0.24 - dp(4))/jieQi.length)) : 0;
    const jqH=jieQi.length? jqRowH*jieQi.length+dp(4) : 0;
    const dowH=Math.min(h*0.10, dp(15));
    const gridH=h-dowH-jqH;
    const cellW=w/7, cellH=gridH/weeks;

    c.fillStyle='#FDECEF'; c.fillRect(0,0,w,h);

    const dows=['T2','T3','T4','T5','T6','T7','CN'];
    c.textAlign='center'; c.textBaseline='alphabetic';
    c.font='bold '+Math.min(dowH*0.62, dp(9))+'px sans-serif';
    for(let i=0;i<7;i++){
        c.fillStyle = i===6 ? '#C62828' : '#7A2B33';
        c.fillText(dows[i], cellW*(i+0.5), dowH*0.70);
    }

    const dayPx=Math.min(cellH*0.34, dp(13));
    const lunPx=Math.min(cellH*0.26, dp(9));
    const gzPx =Math.min(cellH*0.24, dp(8.5));
    const showGanZhi = cellH >= dayPx + gzPx*2 + dp(6);

    const startJdn=jdn(year,month,1)-lead;
    for(let idx=0; idx<weeks*7; idx++){
        const j=startJdn+idx, [cy,cm,cd]=civilOf(j);
        const outside = cm!==month || cy!==year;
        const x=cellW*(idx%7), y=dowH+cellH*Math.floor(idx/7);
        const isToday = j===todayJdn;

        if(isToday){
            c.fillStyle='#FFFBEA'; c.fillRect(x+1,y+1,cellW-2,cellH-2);
            c.strokeStyle='#D32F2F'; c.lineWidth=dp(1.6);
            c.strokeRect(x+2,y+2,cellW-4,cellH-4);
        } else if(outside){
            c.fillStyle='#FDF5F6'; c.fillRect(x+1,y+1,cellW-2,cellH-2);
        }

        const fg = isToday?'#C62828': outside?'#B9A3A7':'#222222';
        const dim= isToday?'#A06B30': outside?'#C2AEB2':'#6B6B6B';

        c.textAlign='left';
        c.font='bold '+dayPx+'px sans-serif';
        c.fillStyle=fg;
        const dayBase = y + dayPx + dp(3);
        c.fillText(String(cd), x+cellW*0.09, dayBase);

        c.textAlign='right';
        c.font=lunPx+'px sans-serif';
        c.fillStyle=dim;
        const L=lunarOf(j);
        c.fillText(L ? (L.day===1 ? L.day+'/'+L.month : String(L.day)) : '', x+cellW*0.93, dayBase);

        if (showGanZhi) {
            const [can,chi]=ganzhi(j);
            c.textAlign='center';
            c.font=(isToday?'bold ':'')+gzPx+'px sans-serif';
            c.fillStyle = isToday?'#7A4A1C':dim;
            const rest = cellH - (dayBase - y);
            c.fillText(can, x+cellW/2, dayBase + rest*0.40);
            c.fillText(chi, x+cellW/2, dayBase + rest*0.84);
        }
    }

    c.strokeStyle='#F3C6CD'; c.lineWidth=1;
    for(let i=1;i<7;i++){c.beginPath();c.moveTo(cellW*i,dowH);c.lineTo(cellW*i,dowH+gridH);c.stroke();}
    for(let r=0;r<=weeks;r++){const y=dowH+cellH*r;c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke();}

    if (jieQi.length) {
        let y = dowH + gridH + dp(3);
        c.font = Math.min(jqRowH*0.62, dp(10))+'px sans-serif';
        for (const it of jieQi) {
            const [jy,jm,jd]=civilOf(it.jdn);
            const p=n=>(n<10?'0':'')+n;
            c.textAlign='left';  c.fillStyle='#222222';
            c.font='bold '+Math.min(jqRowH*0.62, dp(10))+'px sans-serif';
            c.fillText(it.name, dp(6), y+jqRowH*0.72);
            c.textAlign='right'; c.fillStyle='#6B6B6B';
            c.font=Math.min(jqRowH*0.62, dp(10))+'px sans-serif';
            c.fillText(p(Math.floor(it.minutes/60))+':'+p(it.minutes%60)+
                       ' - '+p(jd)+'/'+p(jm)+'/'+jy, w-dp(6), y+jqRowH*0.72);
            y += jqRowH;
        }
    }
}

const HEADER_DP = 32;
const params = new URLSearchParams(location.search);
const today = params.get('today') || new Date().toISOString().slice(0,10);
const [ty,tm,td] = today.split('-').map(Number);
const todayJdn = jdn(ty,tm,td);
const view = (params.get('month') || `${ty}-${tm}`).split('-').map(Number);

// Kích thước widget thật trên lưới màn hình chính của Samsung One UI.
const SIZES = [
    [330, 192, '4×2 ô (nhỏ nhất)'],
    [330, 260, '4×3 ô'],
    [330, 352, '4×4 ô'],
    [250, 260, '3×3 ô'],
];
for (const [wd,hd,label] of SIZES) {
    const fig=document.createElement('figure');
    fig.innerHTML = `<figcaption>${label} — ${wd}×${hd}dp</figcaption>
        <div class="widget" style="width:${wd}px">
          <div class="whead"><div class="wnav">‹</div>
            <div class="wtitle">LỊCH ÂM THÁNG ${view[1]}/${view[0]}</div>
            <div class="wnav">›</div></div>
        </div>`;
    const cv=document.createElement('canvas');
    fig.querySelector('.widget').append(cv);
    document.body.append(fig);
    drawBody(cv, wd, hd-HEADER_DP, 3, view[0], view[1], todayJdn);
}
document.body.dataset.ready='1';
</script>
</body></html>
